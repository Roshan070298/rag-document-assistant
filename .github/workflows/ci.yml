# .github/workflows/ci.yml

name: CI Pipeline — Ask My Docs

# Kab chalega ye pipeline?
on:
  push:
    branches: [ main ]        # main pe push hone pe
  pull_request:
    branches: [ main ]        # PR raise hone pe

jobs:
  # JOB 1: Code Quality + Tests
  test:
    runs-on: ubuntu-latest    # GitHub ka free Linux server

    steps:
      # Step 1: Code checkout karo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Python setup karo
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Dependencies install karo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Code style check — ruff
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      # Step 5: Tests chalao
      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}